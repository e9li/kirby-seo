label: e9li.seo.tab
icon: search
columns:
    - width: 2/3
      fields:
          metaHeadline:
              label: e9li.seo.meta.headline
              type: headline
              numbered: false
          metaTemplate:
              label: e9li.seo.metaTemplate.label
              help: e9li.seo.metaTemplate.help
              type: text
              placeholder: "{{ page.title }} | {{ site.title }}"
          metaDescription:
              label: e9li.seo.metaDescription.label
              help: e9li.seo.metaDescription.help
              type: textarea
              buttons: false
              size: small
          lineMeta:
              type: line
          ogHeadline:
              label: e9li.seo.og.headline
              type: headline
              numbered: false
              help: e9li.seo.og.headline.help
          ogTemplate:
              label: e9li.seo.ogTemplate.label
              help: e9li.seo.ogTemplate.help
              type: text
              placeholder: "{{ page.title }}"
          ogDescription:
              label: e9li.seo.ogDescription.label
              help: e9li.seo.ogDescription.help
              type: textarea
              buttons: false
              size: small
          ogSiteName:
              label: e9li.seo.ogSiteName.label
              help: e9li.seo.ogSiteName.help
              type: text
              placeholder: "{{ site.title }}"
              width: 1/2
          ogImage:
              label: e9li.seo.ogImage.label
              type: files
              multiple: false
              query: site.images.filterBy('isResizable', true)
              width: 1/2
          cropOgImage:
              label: e9li.seo.cropOgImage.label
              help: e9li.seo.cropOgImage.help
              type: toggle
              default: true
              text:
                  - "{{ t('e9li.seo.common.no') }}"
                  - "{{ t('e9li.seo.common.yes') }}"
          lineRobots:
              type: line
          robotsHeadline:
              label: e9li.seo.robots.headline
              type: headline
              numbered: false
          robotsIndex:
              label: e9li.seo.robots.index.label
              help: e9li.seo.robots.index.help
              type: toggles
              width: 1/2
              default: "true"
              reset: false
              options:
                  "true": "{{ t('e9li.seo.common.yes') }}"
                  "false": "{{ t('e9li.seo.common.no') }}"
          robotsFollow:
              label: e9li.seo.robots.follow.label
              help: e9li.seo.robots.follow.help
              type: toggles
              width: 1/2
              default: "true"
              reset: false
              options:
                  "true": "{{ t('e9li.seo.common.yes') }}"
                  "false": "{{ t('e9li.seo.common.no') }}"
          robotsArchive:
              label: e9li.seo.robots.archive.label
              help: e9li.seo.robots.archive.help
              type: toggles
              width: 1/2
              default: "true"
              reset: false
              options:
                  "true": "{{ t('e9li.seo.common.yes') }}"
                  "false": "{{ t('e9li.seo.common.no') }}"
          robotsImageindex:
              label: e9li.seo.robots.imageindex.label
              help: e9li.seo.robots.imageindex.help
              type: toggles
              width: 1/2
              default: "true"
              reset: false
              options:
                  "true": "{{ t('e9li.seo.common.yes') }}"
                  "false": "{{ t('e9li.seo.common.no') }}"
          robotsSnippet:
              label: e9li.seo.robots.snippet.label
              help: e9li.seo.robots.snippet.help
              type: toggles
              width: 1/2
              default: "true"
              reset: false
              options:
                  "true": "{{ t('e9li.seo.common.yes') }}"
                  "false": "{{ t('e9li.seo.common.no') }}"
          lineSocial:
              type: line
          socialHeadline:
              label: e9li.seo.social.headline
              type: headline
              numbered: false
          socialMedia:
              label: e9li.seo.socialMedia.label
              help: e9li.seo.socialMedia.help
              type: object
              fields:
                  facebook:
                      label: Facebook
                      type: url
                  instagram:
                      label: Instagram
                      type: url
                  linkedin:
                      label: LinkedIn
                      type: url
                  x:
                      label: X
                      type: url
                  youtube:
                      label: YouTube
                      type: url
    - width: 1/3
      fields:
          seoInfo:
              type: info
              theme: info
              text: e9li.seo.site.info
